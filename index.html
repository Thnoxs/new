    <style>
      :root {
        --glow-bg: rgba(00, 255, 0, 0.495);
      }
      body {
        background: white;
        overflow: hidden;
        padding: 0 40px;
      }
      nav {
        padding: 10px 50px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.122);
        display: flex !important;
        justify-content: space-between;
        align-items: center;
      }
      .lifeSpan {
        width: 20px !important;
        height: 20px;
      }
      main {
        display: flex;
        justify-content: space-between;
      }
      aside {
        width: 300px;
        height: 100%;
        border-left: 1px solid rgba(0, 0, 0, 0.122);
      }
      .box {
        width: 100%;
        height: 100%;
        cursor: pointer;
        transition: transform 0.4s;
        font-size: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.122);
        position: relative;
        transition: 0.3s;
      }
      .box::before {
        content: attr(data-index);
        font-size: 10px;
        font-weight: 600;
        position: absolute;
        /* opacity: 0; */
        top: 10px;
        right: 10px;
        color: #f1f1f1;
        width: 25px;
        height: 25px;
        border-radius: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #76206a;
        border: 1px solid rgba(0, 0, 0, 0.122);
      }
      /* .box:hover::before {
        opacity: 1;
        transition: 0.3s;
      } */
      .box:active {
        transform: scale(0.9);
      }
      img {
        width: 70% !important;
        height: 70% !important;
        object-fit: contain;
        aspect-ratio: 1/1;
      }
      #box-container {
        padding: 5px;
      }
      .selected {
        background: rgb(190, 255, 190) !important;
        border: 1px solid darkgreen;
      }
      .bom {
        background: rgb(255, 190, 190) !important;
      }
      .tag {
        color: #212121;
        font-weight: 600;
        position: absolute;
        font-size: 1.5rem;
      }
