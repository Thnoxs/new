    <link rel="shortcut icon" href="https://www.google.com/s2/favicons?domain=game.org" type="image/x-icon" />
    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --glow-bg: rgba(5, 23, 5, 0.495);
      }
      body {
        background: black;
        position: relative;
        overflow: hidden;
      }
      #back {
        width: 100%;
        height: 100%;
        position: absolute;
        background: url(bg.jpeg);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        opacity: 0.2;
      }
      nav {
        padding: 10px 50px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.122);
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        z-index: 999;
      }
      .lifeSpan {
        width: 20px !important;
        height: 20px;
      }
      main {
        margin: 60px 10px 0 40px;
        display: flex;
        justify-content: space-between;
      }
      aside {
        width: 300px;
        height: 100%;
        background: white;
        border-left: 1px solid rgba(0, 0, 0, 0.122);
      }
      .box {
        width: 100%;
        height: 100%;
        cursor: pointer;
        transition: transform 0.4s;
        font-size: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(103, 102, 102, 0.028);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.122);
        position: relative;
        transition: 0.3s;
      }
      .box::before {
        content: attr(data-index);
        font-size: 10px;
        font-weight: 600;
        position: absolute;
        /* opacity: 0; */
        top: 10px;
        right: 10px;
        color: #c8a6ff;
        width: 25px;
        height: 25px;
        border-radius: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* .box:hover::before {
        opacity: 1;
        transition: 0.3s;
      } */
      .box:active {
        transform: scale(0.9);
      }
      img {
        width: 70% !important;
        height: 70% !important;
        object-fit: contain;
        aspect-ratio: 1/1;
      }
      #box-container {
        padding: 5px;
      }
      .box:hover {
        background: hsla(0, 0%, 40%, 0.244) !important;
        border: 1px dashed #c8a6ff;
      }
      .selected {
        /* background: rgb(190, 255, 190) !important; */
        pointer-events: none;
      }
      .bom {
        /* background: rgb(255, 190, 190) !important; */
      }
      .tag {
        color: #212121;
        font-weight: 600;
        position: absolute;
        font-size: 1.5rem;
      }
    </style>
  </head>
