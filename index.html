      .box {
        width: 100%;
        height: 100%;
        cursor: pointer;
        transition: transform 0.4s;
        font-size: 50px;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #212121;
        border: 1px solid rgba(33, 33, 33, 0.122);
      }
      img {
        width: 90% !important;
        height: 90% !important;
        object-fit: contain;
        aspect-ratio: 1/1;
      }

      .selected {
        background: rgb(0, 44, 20);
        border: 1px solid lightgreen;
      }
      .bom {
        background: rgb(90, 20, 0);
        border: 1px solid lightcoral;
      }
      .tag {

        font-weight: 600;
        position: absolute;
        font-size: 1.5rem;
      }
    </style>
